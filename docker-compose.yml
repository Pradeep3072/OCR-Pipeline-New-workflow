version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"

  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ocr_user
      - POSTGRES_PASSWORD=ocr_password
      - POSTGRES_DB=ocr_db

  api:
    build: .
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=ocr-bucket
      - DATABASE_URL=postgresql://ocr_user:ocr_password@db/ocr_db
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - redis
      - minio
      - db
    volumes:
      - milvus_data:/app/backend/db

  worker:
    build: .
    command: celery -A backend.worker.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=ocr-bucket
      - DATABASE_URL=postgresql://ocr_user:ocr_password@db/ocr_db
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - redis
      - minio
      - db
    volumes:
      - milvus_data:/app/backend/db

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/ocr
    depends_on:
      - api

volumes:
  redis_data:
  minio_data:
  db_data:
  milvus_data:
