apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ocr-pipeline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: ocr-pipeline-worker:latest
        imagePullPolicy: Never # Adjust if using a remote registry
        command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info"]
        env:
        - name: CELERY_BROKER_URL
          value: "redis://redis:6379/0"
        - name: S3_ENDPOINT_URL
          value: "http://minio:9000"
        - name: AWS_ACCESS_KEY_ID
          value: "minioadmin"
        - name: AWS_SECRET_ACCESS_KEY
          value: "minioadmin"
        - name: S3_BUCKET_NAME
          value: "ocr-bucket"
